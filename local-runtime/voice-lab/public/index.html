<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Lab</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#252a34; --text:#e8eaed;
          --dim:#8b93a1; --good:#3ecf8e; --warn:#e0a33e; --bad:#e05252; --accent:#4a7dff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
         display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 22px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:18px; flex-shrink:0; }
  header h1 { font-size:15px; font-weight:600; letter-spacing:.3px; }
  .spacer { flex:1; }
  .meta { color:var(--dim); font-size:13px; }
  main { flex:1; display:flex; overflow:hidden; }
  aside { width:290px; border-right:1px solid var(--line); overflow-y:auto; flex-shrink:0; }
  .row { padding:9px 16px; border-bottom:1px solid var(--line); cursor:pointer;
         display:flex; gap:9px; align-items:center; font-size:13px; }
  .row:hover { background:var(--panel); }
  .row.active { background:#1d2330; box-shadow:inset 3px 0 0 var(--accent); }
  .row .id { color:var(--dim); font-family:ui-monospace,Menlo,monospace; font-size:11px; width:52px; flex-shrink:0; }
  .row .tx { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:7px; height:7px; border-radius:50%; background:#333a46; flex-shrink:0; }
  .dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  section { flex:1; display:flex; flex-direction:column; padding:30px 40px; overflow-y:auto; }
  .lineid { color:var(--dim); font-family:ui-monospace,Menlo,monospace; font-size:12px;
            letter-spacing:1px; margin-bottom:12px; }
  /* The prompt must ALWAYS be fully visible — an actor cannot read a line
     that runs off the edge. Scales with the window and wraps long Taglish
     sentences instead of clipping them. */
  .prompt { font-size:clamp(19px, 2.4vw, 29px); line-height:1.45; margin-bottom:6px;
            max-width:min(900px, 100%); overflow-wrap:break-word; hyphens:none; }
  .tags { color:var(--dim); font-size:12px; margin-bottom:22px; }
  .meterwrap { max-width:min(900px, 100%); margin-bottom:20px; }
  .meter { height:16px; background:var(--panel); border:1px solid var(--line);
           border-radius:8px; overflow:hidden; position:relative; }
  .meterbar { height:100%; width:0%; background:var(--good); transition:width .05s linear; }
  .meterbar.hot { background:var(--warn); }
  .meterbar.clip { background:var(--bad); }
  .meterticks { display:flex; justify-content:space-between; color:var(--dim);
                font-size:10px; font-family:ui-monospace,Menlo,monospace; margin-top:3px; }
  .controls { display:flex; gap:12px; align-items:center; margin-bottom:22px; flex-wrap:wrap; }
  button { font:inherit; font-size:14px; font-weight:500; border:1px solid var(--line);
           background:var(--panel); color:var(--text); padding:11px 22px; border-radius:8px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:#3a4252; }
  button:disabled { opacity:.35; cursor:default; }
  button.rec { background:var(--bad); border-color:var(--bad); color:#fff; min-width:150px; }
  button.rec.on { background:#7a1f1f; animation:pulse 1.1s infinite; }
  @keyframes pulse { 50%{opacity:.55} }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .timer { font-family:ui-monospace,Menlo,monospace; font-size:22px; color:var(--dim); min-width:64px; }
  .stats { display:flex; gap:26px; padding:16px 20px; background:var(--panel);
           border:1px solid var(--line); border-radius:10px; margin-bottom:14px; max-width:820px; }
  .stat b { display:block; font-size:11px; color:var(--dim); font-weight:500;
            text-transform:uppercase; letter-spacing:.6px; margin-bottom:3px; }
  .stat span { font-family:ui-monospace,Menlo,monospace; font-size:17px; }
  .issue { padding:9px 14px; border-radius:7px; margin-bottom:7px; font-size:13px;
           background:#2a1f14; border:1px solid #5a3d1a; color:#f0c078; max-width:820px; }
  .issue.bad { background:#2a1414; border-color:#5a1a1a; color:#f08787; }
  .ok { color:var(--good); font-size:13px; }
  audio { width:100%; max-width:820px; margin-bottom:14px; }
  .hint { color:var(--dim); font-size:12.5px; margin-top:auto; padding-top:20px; }
  kbd { background:var(--panel); border:1px solid var(--line); border-radius:4px;
        padding:1px 6px; font-family:ui-monospace,Menlo,monospace; font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>Voice Lab</h1>
  <span class="meta" id="device">—</span>
  <span class="spacer"></span>
  <span class="meta" id="progress">0 / 0</span>
  <button id="export">Export metadata.csv</button>
</header>
<main>
  <aside id="list"></aside>
  <section>
    <div class="lineid" id="lineid">—</div>
    <div class="prompt" id="prompt">Loading…</div>
    <div class="tags" id="tags"></div>
    <div class="meterwrap">
      <div class="meter"><div class="meterbar" id="meterbar"></div></div>
      <div class="meterticks"><span>-40</span><span>-20</span><span>-12</span><span>-6</span><span>-3</span><span>0 dB</span></div>
    </div>
    <div class="controls">
      <button class="rec" id="rec">● Record</button>
      <span class="timer" id="timer">0.0s</span>
      <button id="prev">← Prev</button>
      <button class="primary" id="next">Next →</button>
      <button id="del">Delete take</button>
    </div>
    <audio id="player" controls hidden></audio>
    <div id="statsBox"></div>
    <div class="hint">
      <kbd>space</kbd> record / stop &nbsp;·&nbsp; <kbd>→</kbd> next &nbsp;·&nbsp;
      <kbd>←</kbd> previous &nbsp;·&nbsp; <kbd>P</kbd> play back
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
